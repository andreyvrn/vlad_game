name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  htmlhint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint HTML
        run: npx htmlhint index.html snake_slayer.html
